<line x1="250" y1="36" x2="250" y2="286" stroke="#5B7C8A" stroke-width="0.8"/>
<line x1="250" y1="286" x2="650" y2="286" stroke="#5B7C8A" stroke-width="0.8"/>
<text x="375" y="24" font-family="Times New Roman, Times, serif" font-size="13" fill="#1B3A4B" text-anchor="middle">Five configured</text>
