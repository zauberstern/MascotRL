<text x="238" y="78" font-family="Times New Roman, Times, serif" font-size="15" fill="#1B3A4B" text-anchor="end">Zero allowed</text>
<rect x="250" y="58" width="162.5" height="32" fill="#1B3A4B"/>
<text x="422" y="80" font-family="Times New Roman, Times, serif" font-size="15" fill="#1B3A4B">6.5</text>
<text x="238" y="142" font-family="Times New Roman, Times, serif" font-size="15" fill="#1B3A4B" text-anchor="end">Entmax 1.5</text>
<rect x="250" y="122" width="175" height="32" fill="#5B7C8A"/>
<text x="435" y="144" font-family="Times New Roman, Times, serif" font-size="15" fill="#1B3A4B">7.0</text>
<text x="238" y="206" font-family="Times New Roman, Times, serif" font-size="15" fill="#1B3A4B" text-anchor="end">A crumb each</text>
