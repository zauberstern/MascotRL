<text x="375" y="308" font-family="Times New Roman, Times, serif" font-size="12" fill="#1B3A4B" text-anchor="middle">5</text>
<text x="500" y="308" font-family="Times New Roman, Times, serif" font-size="12" fill="#546B78" text-anchor="middle">10</text>
