<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
<desc>Median cost that showed up, in basis points, next to the five that were configured. The bars are a bill for changing the holdings.</desc>
<rect width="640" height="280" fill="#FFFFFF"/>
<line x1="210" y1="161.5" x2="600" y2="161.5" stroke="#C4A35A" stroke-width="1.2"/>
<text x="210" y="153.5" font-family="Times New Roman, Times, serif" font-size="12" fill="#1B3A4B">Five, as configured</text>
<line x1="210" y1="224.0" x2="600" y2="224.0" stroke="#5B7C8A" stroke-width="0.8"/>
<rect x="260" y="142.8" width="56" height="81.2" fill="#1B3A4B"/>
<text x="288" y="134.8" font-family="Times New Roman, Times, serif" font-size="13" fill="#1B3A4B" text-anchor="middle">6.5</text>
<text x="288" y="244.0" font-family="Times New Roman, Times, serif" font-size="12" fill="#1B3A4B" text-anchor="middle">Zero allowed</text>
<rect x="400" y="96.5" width="56" height="127.5" fill="#1B3A4B"/>
<text x="428" y="88.5" font-family="Times New Roman, Times, serif" font-size="13" fill="#1B3A4B" text-anchor="middle">10.2</text>
<text x="428" y="244.0" font-family="Times New Roman, Times, serif" font-size="12" fill="#1B3A4B" text-anchor="middle">A crumb each</text>
<rect x="540" y="56.5" width="56" height="167.5" fill="#1B3A4B"/>
<text x="568" y="48.5" font-family="Times New Roman, Times, serif" font-size="13" fill="#1B3A4B" text-anchor="middle">13.4</text>
<text x="568" y="244.0" font-family="Times New Roman, Times, serif" font-size="12" fill="#1B3A4B" text-anchor="middle">Capped, then filled</text>
</svg>